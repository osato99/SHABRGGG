<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #0a0a0a;
            --dark-gray: #151515;
            --charcoal: #1e1e1e;
            --light-gray: #a0a0a0;
            --neon-cyan: #00f3ff;
            --neon-purple: #9d00ff;
            --white: #f5f5f5;
            --gradient: radial-gradient(circle at center, #1a1a1a 0%, #0a0a0a 100%);
            --card-bg: rgba(30, 30, 30, 0.7);
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--black);
            color: var(--white);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Background effects */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--gradient);
            z-index: -3;
        }

        .light-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(0, 243, 255, 0.03) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(157, 0, 255, 0.03) 0%, transparent 50%);
            z-index: -2;
            pointer-events: none;
        }

        .grid-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            pointer-events: none;
            opacity: 0.5;
        }

        /* Main container */
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Profile Header */
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 0 30px;
            width: 100%;
        }

        .profile-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 20px;
            border: 3px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
            position: relative;
        }

        .profile-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-image::after {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-purple));
            z-index: -1;
            opacity: 0.5;
        }

        .profile-name {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .profile-bio {
            color: var(--light-gray);
            font-weight: 300;
            font-size: 1rem;
            text-align: center;
            max-width: 400px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .stats {
            display: flex;
            gap: 30px;
            margin-bottom: 40px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--neon-cyan);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--light-gray);
            font-weight: 300;
            margin-top: 5px;
        }

        /* Links Container */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 40px;
        }

        .link-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: var(--white);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .link-card:hover {
            border-color: rgba(0, 243, 255, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.05), transparent);
            transition: left 0.7s ease;
        }

        .link-card:hover::before {
            left: 100%;
        }

        .link-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 1.2rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .link-content {
            flex: 1;
        }

        .link-title {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 4px;
            letter-spacing: 0.3px;
        }

        .link-url {
            font-size: 0.85rem;
            color: var(--light-gray);
            font-weight: 300;
        }

        .link-arrow {
            color: var(--neon-cyan);
            opacity: 0.7;
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }

        .link-card:hover .link-arrow {
            transform: translateX(5px);
            opacity: 1;
        }

        /* Social Links */
        .social-links {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }

        .social-link {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--white);
            font-size: 1.3rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-link:hover {
            transform: translateY(-5px);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 5px 15px rgba(0, 243, 255, 0.1);
        }

        /* Footer */
        footer {
            padding: 30px 0;
            text-align: center;
            color: var(--light-gray);
            font-weight: 300;
            font-size: 0.9rem;
            letter-spacing: 1px;
            width: 100%;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .footer-logo {
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: var(--white);
            position: relative;
            display: inline-block;
        }

        .footer-logo::before {
            content: '';
            position: absolute;
            left: -5px;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 20px;
            background: var(--neon-cyan);
            box-shadow: 0 0 8px var(--neon-cyan);
        }

        /* Notification */
        .notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-left: 4px solid var(--neon-cyan);
            padding: 15px 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transition: all 0.5s ease;
            z-index: 100;
            backdrop-filter: blur(10px);
            max-width: 400px;
            width: 90%;
        }

        .notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .notification i {
            color: var(--neon-cyan);
            font-size: 1.2rem;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .link-card {
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
        }

        .link-card:nth-child(1) { animation-delay: 0.1s; }
        .link-card:nth-child(2) { animation-delay: 0.2s; }
        .link-card:nth-child(3) { animation-delay: 0.3s; }
        .link-card:nth-child(4) { animation-delay: 0.4s; }
        .link-card:nth-child(5) { animation-delay: 0.5s; }
        .link-card:nth-child(6) { animation-delay: 0.6s; }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            
            .profile-image {
                width: 100px;
                height: 100px;
            }
            
            .profile-name {
                font-size: 1.5rem;
            }
            
            .profile-bio {
                font-size: 0.9rem;
                padding: 0 10px;
            }
            
            .stats {
                gap: 20px;
            }
            
            .link-card {
                padding: 15px;
            }
        }

        @media (max-width: 400px) {
            .social-links {
                gap: 15px;
            }
            
            .social-link {
                width: 45px;
                height: 45px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>

    <script>
        // Link click handler with notification
        document.querySelectorAll('.link-card').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                
                const linkName = this.getAttribute('data-link');
                const linkUrl = this.getAttribute('href');
                
                // Show notification
                const notification = document.getElementById('notification');
                const linkNameSpan = document.getElementById('link-name');
                
                linkNameSpan.textContent = linkName;
                notification.classList.add('show');
                
                // Navigate after a short delay
                setTimeout(() => {
                    window.open(linkUrl, '_blank');
                    
                    // Hide notification after 2 seconds
                    setTimeout(() => {
                        notification.classList.remove('show');
                    }, 2000);
                }, 500);
            });
        });
        
        // Dynamic background effect
        document.addEventListener('mousemove', (e) => {
            const lightEffect = document.querySelector('.light-effect');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            lightEffect.style.background = `
                radial-gradient(circle at ${x * 100}% ${y * 100}%, rgba(0, 243, 255, 0.04) 0%, transparent 30%),
                radial-gradient(circle at ${100 - x * 100}% ${100 - y * 100}%, rgba(157, 0, 255, 0.04) 0%, transparent 30%)
            `;
        });
        
        // Social link hover effects
        document.querySelectorAll('.social-link').forEach(link => {
            link.addEventListener('mouseenter', function() {
                const icon = this.querySelector('i');
                const randomHue = Math.floor(Math.random() * 360);
                icon.style.color = `hsl(${randomHue}, 100%, 70%)`;
            });
            
            link.addEventListener('mouseleave', function() {
                const icon = this.querySelector('i');
                icon.style.color = '';
            });
        });
        
        // Add subtle animation to profile image
        const profileImage = document.querySelector('.profile-image');
        profileImage.addEventListener('mouseenter', function() {
            this.style.transform = 'scale(1.05)';
            this.style.boxShadow = '0 0 30px rgba(0, 243, 255, 0.2)';
        });
        
        profileImage.addEventListener('mouseleave', function() {
            this.style.transform = 'scale(1)';
            this.style.boxShadow = '0 0 20px rgba(0, 243, 255, 0.1)';
        });
        
        // Animate stats on load
        const statValues = document.querySelectorAll('.stat-value');
        statValues.forEach(stat => {
            const originalText = stat.textContent;
            stat.textContent = '0';
            
            let counter = 0;
            const target = parseInt(originalText.replace('K', '000').replace('.5K', '500'));
            const increment = target / 30;
            
            const updateCounter = () => {
                counter += increment;
                if (counter < target) {
                    if (originalText.includes('K')) {
                        stat.textContent = (counter / 1000).toFixed(1).replace('.0', '') + 'K';
                    } else {
                        stat.textContent = Math.floor(counter);
                    }
                    setTimeout(updateCounter, 50);
                } else {
                    stat.textContent = originalText;
                }
            };
            
            setTimeout(updateCounter, 800);
        });
    </script>
